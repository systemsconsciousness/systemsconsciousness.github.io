<div class="retro-hud-bar">
    <div class="hud-stat-group">
        <span class="hud-stat"><span class="hud-pulse"></span> <span class="hud-stat-label">SCORE:</span> <span class="hud-stat-val">001986</span></span>
        <span class="hud-stat"><span class="hud-stat-label">BAUM:</span> <span class="hud-stat-val">$2,400</span></span>
        <span class="hud-stat"><span class="hud-stat-label">🍙:</span> <span class="hud-stat-val">x 3</span></span>
        <span class="hud-stat"><span class="hud-stat-label">STAGE:</span> <span class="hud-stat-val">1 // MT. ETERNAL</span></span>
    </div>
    <div class="hud-stat-group">
        <span class="hud-stat"><span class="hud-stat-label">ITEM:</span> <span class="hud-stat-val">✊ POWER BRACELET</span></span>
    </div>
</div>

<div class="header-meta">
    <div class="logo">
        <span class="logo-symbol">?</span>
        <a href="{{siteUrl || '/'}}">{{siteTitle || 'Systems Consciousness'}}</a>
    </div>
    <div class="header-nav-wrapper">
        <nav class="nav-links" id="mainNavLinks" aria-label="Main Navigation">
            {{navigation:primary}}
        </nav>
    </div>
    <div class="header-actions">
        <button type="button" class="pixel-btn" id="scanlineToggle" title="Toggle CRT Scanlines" aria-label="Toggle CRT Scanlines">
            <span class="material-symbols-outlined" style="font-size: 14px;">tv</span> CRT
        </button>
        <button type="button" class="pixel-btn" id="themeToggle" aria-label="Switch theme">
            <span class="material-symbols-outlined" style="font-size: 14px;">wb_sunny</span> DAY/CASTLE
        </button>
        <button type="button" class="pixel-btn nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mainNavLinks">
            <span class="material-symbols-outlined nav-toggle-icon" style="font-size: 14px;">menu</span>
        </button>
    </div>
</div>
