<div class="header-meta">
    <div class="logo">
        <a href="{{siteUrl || '/'}}">{{siteTitle || 'Systems Consciousness'}}</a>
    </div>
    <div class="header-nav-wrapper">
        <nav class="nav-links" id="mainNavLinks" aria-label="Main Navigation">
            {{navigation:primary}}
        </nav>
    </div>
    <div class="header-actions">
        <button type="button" class="theme-toggle-btn" id="themeToggle" aria-label="Toggle visual theme">
            Dark
        </button>
        <button type="button" class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mainNavLinks">
            <span class="material-symbols-outlined" style="font-size: 20px;">menu</span>
        </button>
    </div>
</div>
