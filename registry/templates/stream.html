<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{{title}} | {{siteTitle}}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    {{style:main.css}}
    {{script:theme.js}}
</head>

<body>
    <div class="container">
        <header>
            {{component:header}}
        </header>

        <div class="question-block-frame">
            <div class="pixel-box-header">
                <span>RADAXIAN QUEST ARCHIVE // ALL STAGES</span>
                <span>STATUS: JANKEN MATCH READY</span>
            </div>
            <h1>{{title}}</h1>
            <p class="intro">{{intro}}<span class="dialog-cursor"></span></p>
        </div>

        <section>
            <div class="section-label">Jan-Ken-Pon Feed & Item Logs</div>
            <div class="stream-controls">
                <div class="filter-pills">
                    <button type="button" class="filter-pill active" data-filter="all">[ALL STAGES]</button>
                    <button type="button" class="filter-pill" data-filter="systems">[✊ ROCK / SYSTEMS]</button>
                    <button type="button" class="filter-pill" data-filter="zen">[✌️ SCISSORS / ZEN]</button>
                    <button type="button" class="filter-pill" data-filter="loop">[✋ PAPER / LOOPS]</button>
                    <button type="button" class="filter-pill" data-filter="quote">[🍙 WISDOM QUOTES]</button>
                    <button type="button" class="filter-pill" data-filter="link">[🚁 HYPERLINKS]</button>
                </div>
                <div class="stream-count-hud" id="streamCount">[ALL TRANSMISSIONS]</div>
            </div>

            <div class="products-grid">
                {{streamPosts}}
            </div>
        </section>

        {{component:footer}}
    </div>
</body>

</html>
