<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{{title}} | {{siteTitle}}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    {{style:main.css}}
    {{script:theme.js}}
</head>

<body>
    <div class="container">
        <header>
            {{component:header}}
        </header>

        <div class="question-block-frame">
            <div class="pixel-box-header">
                <span>RESTRAINT ARCHIVE // CONTINUOUS TRANSMISSION STREAM</span>
                <span>STATUS: HOMEOSTASIS</span>
            </div>
            <h1>{{title}}</h1>
            <p class="intro">{{intro}}<span class="dialog-cursor"></span></p>
        </div>

        <section>
            <div class="section-label">Field Vessels & Inscription Logs</div>
            <div class="stream-controls">
                <div class="filter-pills">
                    <button type="button" class="filter-pill active" data-filter="all">[ ALL VESSELS ]</button>
                    <button type="button" class="filter-pill" data-filter="systems">[ I. CYBERNETIC RESISTANCE ]</button>
                    <button type="button" class="filter-pill" data-filter="zen">[ II. ZEN NON-DUALITY ]</button>
                    <button type="button" class="filter-pill" data-filter="loop">[ III. MORPHOLOGICAL LOOPS ]</button>
                    <button type="button" class="filter-pill" data-filter="quote">[ IV. SCRIPTURAL INSCRIPTIONS ]</button>
                    <button type="button" class="filter-pill" data-filter="link">[ V. FIELD ACCESSIONS ]</button>
                </div>
                <div class="stream-count-hud" id="streamCount">[ ALL ACCESSIONS ]</div>
            </div>

            <div class="products-grid">
                {{streamPosts}}
            </div>
        </section>

        {{component:footer}}
    </div>
</body>

</html>
