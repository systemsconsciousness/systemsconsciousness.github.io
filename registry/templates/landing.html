<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{{title}} | {{siteTitle}}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    {{style:main.css}}
    {{script:theme.js}}
</head>

<body>
    <div class="container">
        <header>
            {{component:header}}
        </header>

        <div class="hero-dialog">
            <div class="hero-speaker-badge">An Ongoing Inscription</div>
            <h1>{{title}}</h1>
            <p class="intro">{{heroText}}</p>
        </div>

        <section style="padding-top: 1rem;">
            <div class="stream-controls">
                <div class="filter-pills">
                    <button type="button" class="filter-pill active" data-filter="all">All</button>
                    <button type="button" class="filter-pill" data-filter="systems">Systems Dynamics</button>
                    <button type="button" class="filter-pill" data-filter="zen">Zen Non-Duality</button>
                    <button type="button" class="filter-pill" data-filter="loop">Cybernetics</button>
                    <button type="button" class="filter-pill" data-filter="quote">Quotations</button>
                </div>
                <div class="stream-count-hud" id="streamCount">6 entries</div>
            </div>

            <div class="products-grid">
                {{streamPosts}}
            </div>
        </section>

        <section>
            <div class="section-label">Dialogue & Correspondence</div>
            <div class="contact-container">
                <a href="mailto:{{contactEmail}}" class="email">{{contactEmail}}</a>
                <button class="pixel-btn" onclick="copyEmail(this)" aria-label="Copy email address">
                    Copy Address
                </button>
                <span class="copy-feedback" id="copyFeedback">[ Copied ]</span>
            </div>
        </section>

        {{component:footer}}
    </div>
</body>

</html>
