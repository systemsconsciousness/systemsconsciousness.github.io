<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{{title}} | {{siteTitle}}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    {{style:main.css}}
    {{script:theme.js}}
</head>

<body>
    <div class="container">
        <header>
            {{component:header}}
            <h1>{{title}}</h1>
            <p class="intro">{{intro}}</p>
        </header>

        <section>
            <div class="section-label">{{eyebrow}}</div>
            <div class="body">{{body}}</div>
        </section>

        <section>
            <div class="section-label">{{contactLabel}}</div>
            <div class="contact-container">
                <a href="mailto:{{contactEmail}}" class="email">{{contactEmail}}</a>
                <button class="copy-btn" onclick="copyEmail(this)" aria-label="Copy email address">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                    </svg>
                </button>
                <span class="copy-feedback" id="copyFeedback">Copied</span>
            </div>
        </section>

        {{component:footer}}
    </div>
</body>

</html>
