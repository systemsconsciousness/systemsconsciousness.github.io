<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{{title}} | {{siteTitle}}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    {{style:main.css}}
    {{script:theme.js}}
</head>

<body>
    <div class="container">
        <header>
            {{component:header}}
        </header>

        <div class="hero-dialog">
            <div class="hero-speaker-badge">{{eyebrow || 'PHILOSOPHY'}}</div>
            <h1>{{title}}</h1>
            <p class="intro">{{intro}}</p>
        </div>

        <section>
            <div class="section-label">Treatise</div>
            <div class="pixel-box">
                <div class="body">{{body}}</div>
            </div>
        </section>

        <section>
            <div class="section-label">{{contactLabel || 'Correspondence'}}</div>
            <div class="contact-container">
                <a href="mailto:{{contactEmail}}" class="email">{{contactEmail}}</a>
                <button class="pixel-btn" onclick="copyEmail(this)" aria-label="Copy email address">
                    Copy Address
                </button>
                <span class="copy-feedback" id="copyFeedback">[ Copied ]</span>
            </div>
        </section>

        {{component:footer}}
    </div>
</body>

</html>
