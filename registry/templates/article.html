<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>{{title}} | {{siteTitle}}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet">
    {{style:main.css}}
    {{script:theme.js}}
</head>

<body>
    <div class="container">
        <header>
            {{component:header}}
        </header>

        <div style="margin-bottom: 1.5rem;">
            <a href="/journal" class="pixel-btn">
                ◀ RETURN TO RADAXIAN MAP
            </a>
        </div>

        <article class="question-block-frame">
            <div class="pixel-box-header">
                <span>{{eyebrow || 'TRANSMISSION'}} // {{publishedAt}}</span>
                <span>ENTRY ID: #{{postTitle || title}}</span>
            </div>

            <h1 style="margin-top: 1rem;">{{title}}</h1>
            
            {{excerpt ? '<div class="quote-highlight">' + excerpt + '</div>' : ''}}

            <div class="body" style="margin-top: 2rem;">
                {{body}}
            </div>
        </article>

        <section>
            <div class="section-label">Nearby Miracle World Logs</div>
            <div class="products-grid">
                {{nextPosts}}
            </div>
        </section>

        {{component:footer}}
    </div>
</body>

</html>
